<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>VRスナイパー</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap">
<style>
/* 1画面のゲーム。夕暮れの港の上に、作戦メモのようなカードを1枚重ねる。見た目は夕方の港で固定。 */
:root {
  --night: #121826;
  --card: rgba(14, 18, 30, 0.88);
  --ink: #f1ece2;
  --ink-dim: #a9a6a0;
  --amber: #f0a35e;
  --signal: #ff4a3d;
  --line: rgba(241, 236, 226, 0.16);
  --font-display: "Dela Gothic One", "Hiragino Kaku Gothic StdN", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--night); color: var(--ink); font-family: var(--font-body); overflow: hidden; }
canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
#overlay {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: radial-gradient(ellipse at center, rgba(18,24,38,0.3), rgba(18,24,38,0.8));
}
.card {
  width: 100%; max-width: 31rem;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 6px;
  padding: 1.5rem 1.5rem 1.3rem;
  display: flex; flex-direction: column; gap: 0.95rem;
}
.eyebrow { margin: 0; font-size: 0.74rem; letter-spacing: 0.18em; color: var(--ink-dim); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(2.3rem, 9vw, 3.2rem); line-height: 1; margin: 0; text-wrap: balance; }
h1 .dot { color: var(--signal); }
.reticle-rule { position: relative; height: 1px; background: var(--line); }
.reticle-rule::after { content: ""; position: absolute; left: 50%; top: -5px; width: 9px; height: 9px; margin-left: -5px; border: 1px solid var(--signal); border-radius: 50%; }
.how { margin: 0; padding: 0; list-style: none; display: grid; gap: 0.45rem; font-size: 0.94rem; line-height: 1.6; }
.how li { display: grid; grid-template-columns: 5.2rem 1fr; gap: 0.6rem; }
.how b { color: var(--amber); font-weight: 700; }
.buttons { display: flex; flex-wrap: wrap; gap: 0.6rem; }
button {
  font: inherit; font-weight: 700; font-size: 1rem;
  padding: 0.8rem 1.2rem; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--amber); color: var(--ink); background: transparent;
  flex: 1 1 10rem;
}
button.primary { background: var(--amber); color: #1b130b; }
button:disabled { opacity: 0.4; cursor: not-allowed; }
button:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
#note { margin: 0; font-size: 0.82rem; color: var(--ink-dim); line-height: 1.6; }
/* パソコンで遊ぶときのスコープ（画面いっぱいに、のぞいている見え方） */
#scope { position: fixed; inset: 0; pointer-events: none; opacity: 0; }
#scope .mask {
  position: absolute; inset: 0;
  background: radial-gradient(circle at center, rgba(0,0,0,0) 0, rgba(0,0,0,0) 38vmin, rgba(0,0,0,0.55) 41vmin, #000 43.5vmin, #000 100%);
}
#scope svg { position: absolute; left: 50%; top: 50%; width: 88vmin; height: 88vmin; transform: translate(-50%, -50%); }
#scope .hint {
  position: absolute; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom, 0px));
  text-align: center; font-size: 0.85rem; color: var(--ink-dim); letter-spacing: 0.06em;
}
#scope .hint b { color: var(--amber); }
</style>
</head>
<body>
<canvas id="view"></canvas>

<div id="scope" aria-hidden="true">
  <div class="mask"></div>
  <svg viewBox="-100 -100 200 200">
    <defs>
      <radialGradient id="edge" cx="0" cy="0" r="100" gradientUnits="userSpaceOnUse">
        <stop offset="0.78" stop-color="#000" stop-opacity="0"/>
        <stop offset="0.97" stop-color="#000" stop-opacity="0.7"/>
        <stop offset="1" stop-color="#000" stop-opacity="1"/>
      </radialGradient>
    </defs>
    <circle r="100" fill="url(#edge)"/>
    <g stroke="#0b0b0b" fill="none">
      <path d="M-100 0 H-22 M22 0 H100 M0 100 V22 M0 -100 V-22" stroke-width="2.6"/>
      <path d="M-22 0 H22 M0 -22 V22" stroke-width="0.5"/>
    </g>
    <g fill="#0b0b0b">
      <circle cx="-8" r="0.9"/><circle cx="-14" r="0.9"/><circle cx="8" r="0.9"/><circle cx="14" r="0.9"/>
      <circle cy="8" r="0.9"/><circle cy="14" r="0.9"/><circle cy="-8" r="0.9"/><circle cy="-14" r="0.9"/>
    </g>
    <circle r="1" fill="#ff3b2f"/>
    <circle r="99.5" stroke="#1c1e22" stroke-width="1.5" fill="none"/>
  </svg>
  <p class="hint"><b>Shift</b> で息を止めると、ぶれが小さくなります</p>
</div>

<div id="overlay">
  <div class="card">
    <p class="eyebrow">夕方の港 ・ ロボット 10体</p>
    <h1>VRスナイパー<span class="dot">.</span></h1>
    <div class="reticle-rule" aria-hidden="true"></div>
    <ul class="how">
      <li><b>ねらう</b><span>コントローラーを向けた方向。（パソコンはマウス）</span></li>
      <li><b>のぞく</b><span>引き金を押している間、スコープで大きく見えます。（パソコンは左クリックを押したまま）</span></li>
      <li><b>うつ</b><span>引き金をはなすと発射。（パソコンは左クリックをはなす）</span></li>
      <li><b>移動</b><span>タッチパッドを押すと、次の場所へ。緑のひし形を撃っても移動できます。（パソコンは右クリックかスペース）</span></li>
      <li><b>クリア</b><span>ロボットを全部たおしたら終わり。</span></li>
    </ul>
    <div class="buttons">
      <button id="btnVR" class="primary" disabled>VRで遊ぶ</button>
      <button id="btnFlat">画面で遊ぶ</button>
    </div>
    <p id="note">VRが使えるか調べています…</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script>
(function () {
  "use strict";

  // ===== 決まりごと =====
  var EYE = 1.6;
  var NESTS = [
    { x: 0,   z: 30, h: 16, color: 0x56606e },
    { x: -46, z: 6,  h: 24, color: 0x7a4a35 },
    { x: 44,  z: 10, h: 13, color: 0x4d5a4a }
  ];
  var FIELD = { x: 0, z: -90 };
  var SCOPE_FOV = 7;          // VRのスコープの中の見える範囲（小さいほど大きく見える）
  var LENS_R = 0.15, LENS_D = 0.34;
  var BASE_FOV = 72, FLAT_SCOPE_FOV = 9;   // パソコンでのぞいたときは約8倍

  var canvas = document.getElementById("view");
  var overlay = document.getElementById("overlay");
  var btnVR = document.getElementById("btnVR");
  var btnFlat = document.getElementById("btnFlat");
  var note = document.getElementById("note");

  // ===== 描画の準備 =====
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.xr.enabled = true;
  renderer.xr.setReferenceSpaceType("local");
  if (renderer.xr.setFoveation) renderer.xr.setFoveation(1);

  var scene = new THREE.Scene();
  var FOG = new THREE.Color(0xb98a6c);
  scene.background = FOG.clone();
  scene.fog = new THREE.Fog(FOG, 90, 720);

  var camera = new THREE.PerspectiveCamera(72, window.innerWidth / window.innerHeight, 0.05, 2000);
  camera.rotation.order = "YXZ";
  var rig = new THREE.Group();
  rig.add(camera);
  scene.add(rig);

  scene.add(new THREE.HemisphereLight(0xffd7b5, 0x2d3446, 0.8));
  var sun = new THREE.DirectionalLight(0xffb27a, 0.9);
  sun.position.set(-120, 90, -400);
  scene.add(sun);
  var fill = new THREE.DirectionalLight(0x7f8fb8, 0.25);
  fill.position.set(200, 120, 300);
  scene.add(fill);

  // ===== 小さな道具 =====
  function canvasTex(w, h, draw) {
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    draw(c.getContext("2d"), w, h);
    return new THREE.CanvasTexture(c);
  }
  var glowTex = canvasTex(64, 64, function (g) {
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(255,255,255,1)");
    gr.addColorStop(0.25, "rgba(255,255,255,0.6)");
    gr.addColorStop(1, "rgba(255,255,255,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  var blobTex = canvasTex(64, 64, function (g) {
    var gr = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, "rgba(0,0,0,0.75)");
    gr.addColorStop(0.6, "rgba(0,0,0,0.35)");
    gr.addColorStop(1, "rgba(0,0,0,0)");
    g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
  });
  function glowSprite(color, size, opacity) {
    var s = new THREE.Sprite(new THREE.SpriteMaterial({
      map: glowTex, color: color, transparent: true, opacity: opacity || 1,
      blending: THREE.AdditiveBlending, depthWrite: false
    }));
    s.scale.set(size, size, 1);
    return s;
  }
  function box(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
  function rand(a, b) { return a + Math.random() * (b - a); }

  // 弾が当たるもの
  var solids = [];

  // ===== 空・夕日・海 =====
  (function () {
    var tex = canvasTex(4, 256, function (g) {
      var gr = g.createLinearGradient(0, 0, 0, 256);
      gr.addColorStop(0, "#18203a");
      gr.addColorStop(0.3, "#4a4a72");
      gr.addColorStop(0.44, "#b8728a");
      gr.addColorStop(0.5, "#f2a35e");
      gr.addColorStop(0.53, "#b98a6c");
      gr.addColorStop(1, "#b98a6c");
      g.fillStyle = gr; g.fillRect(0, 0, 4, 256);
    });
    var sky = new THREE.Mesh(new THREE.SphereGeometry(1500, 24, 16),
      new THREE.MeshBasicMaterial({ map: tex, side: THREE.BackSide, fog: false, depthWrite: false }));
    scene.add(sky);

    var sunDisc = glowSprite(0xffd08a, 260, 1);
    sunDisc.material.fog = false;
    sunDisc.position.set(-150, 70, -1300);
    scene.add(sunDisc);
    var sunCore = glowSprite(0xfff1d0, 70, 1);
    sunCore.material.fog = false;
    sunCore.position.copy(sunDisc.position);
    scene.add(sunCore);

    var water = new THREE.Mesh(new THREE.PlaneGeometry(2400, 900),
      new THREE.MeshLambertMaterial({ color: 0x2c3a56 }));
    water.rotation.x = -Math.PI / 2;
    water.position.set(0, -1.2, -620);
    scene.add(water);
    // 夕日が海に映る帯
    var glint = new THREE.Mesh(new THREE.PlaneGeometry(40, 900),
      new THREE.MeshBasicMaterial({ map: glowTex, color: 0xffb070, transparent: true, opacity: 0.45, blending: THREE.AdditiveBlending, depthWrite: false }));
    glint.rotation.x = -Math.PI / 2;
    glint.position.set(-60, -1.1, -650);
    scene.add(glint);

    // 対岸の街のシルエット
    var cityMat = new THREE.MeshLambertMaterial({ color: 0x3a3550 });
    for (var i = 0; i < 40; i++) {
      var h = rand(15, 80);
      var b = box(rand(20, 50), h, rand(20, 40), cityMat);
      b.position.set(rand(-700, 700), h / 2 - 1, rand(-1000, -880));
      scene.add(b);
    }
  })();

  // ===== 地面（コンクリートと白線） =====
  var ground;
  (function () {
    var tex = canvasTex(256, 256, function (g) {
      g.fillStyle = "#6e6a66"; g.fillRect(0, 0, 256, 256);
      for (var i = 0; i < 1400; i++) {
        var v = Math.floor(rand(90, 125));
        g.fillStyle = "rgb(" + v + "," + (v - 3) + "," + (v - 6) + ")";
        g.fillRect(rand(0, 256), rand(0, 256), 2, 2);
      }
      g.strokeStyle = "rgba(40,38,36,0.55)"; g.lineWidth = 2;
      g.strokeRect(0, 0, 256, 256);
      g.fillStyle = "rgba(230,200,90,0.75)"; g.fillRect(124, 0, 8, 256);
    });
    tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
    tex.repeat.set(40, 40);
    ground = new THREE.Mesh(new THREE.PlaneGeometry(600, 600), new THREE.MeshLambertMaterial({ map: tex }));
    ground.rotation.x = -Math.PI / 2;
    ground.position.set(0, 0, -100);
    scene.add(ground);
    solids.push(ground);
    // 岸壁のふち
    var quay = box(600, 1.4, 2, new THREE.MeshLambertMaterial({ color: 0x4f4b48 }));
    quay.position.set(0, -0.6, -400);
    scene.add(quay);
  })();

  // ===== コンテナ（1回の描画でまとめて出す） =====
  var LANES = [-42, -67, -92, -117, -142];
  var ROWS = [-30, -55, -80, -105, -130];
  (function () {
    var tex = canvasTex(64, 64, function (g) {
      for (var x = 0; x < 64; x++) {
        var v = (x % 4 < 2) ? 235 : 190;
        g.fillStyle = "rgb(" + v + "," + v + "," + v + ")";
        g.fillRect(x, 0, 1, 64);
      }
      var gr = g.createLinearGradient(0, 0, 0, 64);
      gr.addColorStop(0, "rgba(0,0,0,0)");
      gr.addColorStop(0.75, "rgba(0,0,0,0.05)");
      gr.addColorStop(1, "rgba(0,0,0,0.45)");
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
      g.fillStyle = "rgba(0,0,0,0.35)"; g.fillRect(0, 0, 64, 2); g.fillRect(0, 0, 2, 64); g.fillRect(62, 0, 2, 64);
    });
    var colors = [0x9c3b2a, 0x2f5f8a, 0x2f6b4f, 0xc8742f, 0x8a8f96, 0x6d3a5e, 0xb89a3c];
    // 毎回同じ並びにする（どのロボットも、どこかの場所から必ず見えるように調整してある）
    var seed = 12345;
    function srnd() { seed = (seed * 16807) % 2147483647; return seed / 2147483647; }
    var openX = [38, 22, 54];   // 止まっているロボットの手前は空けておく
    var list = [];
    ROWS.forEach(function (rz, ri) {
      for (var x = -56; x <= 56; x += 6.6) {
        var skip = srnd() < (ri >= 3 ? 0.4 : 0.22);
        for (var o = 0; o < openX.length; o++) if (Math.abs(x - openX[o]) < 6) skip = true;
        if (skip) continue;
        var v = srnd();
        var stack = ri >= 3 ? 1 : (v < 0.45 ? 1 : (v < 0.9 ? 2 : 3));
        for (var s = 0; s < stack; s++) list.push({ x: x + (srnd() - 0.5) * 0.3, y: 1.3 + s * 2.6, z: rz + (srnd() - 0.5) * 0.4, r: (srnd() - 0.5) * 0.06, c: colors[Math.floor(srnd() * colors.length)] });
      }
    });
    var mesh = new THREE.InstancedMesh(new THREE.BoxGeometry(1, 1, 1), new THREE.MeshLambertMaterial({ map: tex }), list.length);
    var m = new THREE.Matrix4(), q = new THREE.Quaternion(), e = new THREE.Euler(), col = new THREE.Color();
    list.forEach(function (it, i) {
      e.set(0, it.r, 0); q.setFromEuler(e);
      m.compose(new THREE.Vector3(it.x, it.y, it.z), q, new THREE.Vector3(6.1, 2.6, 2.44));
      mesh.setMatrixAt(i, m);
      mesh.setColorAt(i, col.setHex(it.c));
    });
    scene.add(mesh);
    solids.push(mesh);
  })();

  // ===== 倉庫 =====
  (function () {
    var wallTex = canvasTex(64, 64, function (g) {
      g.fillStyle = "#9aa3ad"; g.fillRect(0, 0, 64, 64);
      for (var x = 0; x < 64; x += 8) { g.fillStyle = "rgba(0,0,0,0.12)"; g.fillRect(x, 0, 2, 64); }
      var gr = g.createLinearGradient(0, 0, 0, 64);
      gr.addColorStop(0.7, "rgba(0,0,0,0)"); gr.addColorStop(1, "rgba(0,0,0,0.35)");
      g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
    });
    wallTex.wrapS = THREE.RepeatWrapping; wallTex.repeat.set(6, 1);
    var wallMat = new THREE.MeshLambertMaterial({ map: wallTex });
    var roofMat = new THREE.MeshLambertMaterial({ color: 0x5a4f4a });
    var doorMat = new THREE.MeshLambertMaterial({ color: 0x2b2f36 });
    [-78, 78].forEach(function (x) {
      var w = box(30, 10, 40, wallMat); w.position.set(x, 5, -60); scene.add(w); solids.push(w);
      var r = box(31, 0.5, 41, roofMat); r.position.set(x, 10.25, -60); scene.add(r); solids.push(r);
      for (var k = 0; k < 3; k++) {
        var d = box(0.2, 6, 8, doorMat);
        d.position.set(x + (x < 0 ? 15.05 : -15.05), 3, -74 + k * 14);
        scene.add(d);
      }
    });
  })();

  // ===== 港のクレーン =====
  (function () {
    var mat = new THREE.MeshLambertMaterial({ color: 0xc4512f });
    var dark = new THREE.MeshLambertMaterial({ color: 0x3b3f46 });
    [-32, 32].forEach(function (cx) {
      var pts = [[-6, -5], [6, -5], [-6, 5], [6, 5]];
      pts.forEach(function (p) {
        var leg = box(0.9, 30, 0.9, mat); leg.position.set(cx + p[0], 15, -158 + p[1]); scene.add(leg); solids.push(leg);
      });
      var beam1 = box(13, 1.6, 1.2, mat); beam1.position.set(cx, 29.5, -153); scene.add(beam1);
      var beam2 = box(13, 1.6, 1.2, mat); beam2.position.set(cx, 29.5, -163); scene.add(beam2);
      var cross = box(1.2, 1.2, 11, mat); cross.position.set(cx, 12, -158); scene.add(cross);
      var boom = box(2.2, 2.2, 75, mat); boom.position.set(cx, 32, -185); scene.add(boom); solids.push(boom);
      var back = box(2.2, 2.2, 22, mat); back.position.set(cx, 32, -140); scene.add(back);
      var cab = box(3, 2.4, 3, dark); cab.position.set(cx, 30, -170); scene.add(cab);
      var lamp = glowSprite(0xff4030, 3, 0.9); lamp.position.set(cx, 34, -222); scene.add(lamp);
    });
  })();

  // ===== 街灯 =====
  (function () {
    var poleMat = new THREE.MeshLambertMaterial({ color: 0x3d424a });
    for (var i = 0; i < 6; i++) {
      [-62, 62].forEach(function (x) {
        var z = -30 - i * 24;
        var pole = box(0.25, 9, 0.25, poleMat); pole.position.set(x, 4.5, z); scene.add(pole);
        var arm = box(1.6, 0.18, 0.18, poleMat); arm.position.set(x + (x < 0 ? 0.7 : -0.7), 9, z); scene.add(arm);
        var g = glowSprite(0xffc27a, 4.5, 0.85); g.position.set(x + (x < 0 ? 1.4 : -1.4), 8.8, z); scene.add(g);
      });
    }
  })();

  // ===== うつ場所（やぐら） =====
  var beacons = [];
  NESTS.forEach(function (n, idx) {
    var mat = new THREE.MeshLambertMaterial({ color: n.color });
    var rail = new THREE.MeshLambertMaterial({ color: 0xd6d0c4 });
    var s = 1.9;
    [[-s, -s], [s, -s], [-s, s], [s, s]].forEach(function (p) {
      var leg = box(0.35, n.h, 0.35, mat); leg.position.set(n.x + p[0], n.h / 2, n.z + p[1]); scene.add(leg);
    });
    // 斜めの補強
    var levels = Math.floor(n.h / 5);
    for (var l = 0; l < levels; l++) {
      var y = 2.5 + l * 5;
      [0, 1].forEach(function (side) {
        var br = box(0.15, 0.15, 5.4, mat);
        br.position.set(n.x + (side ? s : -s), y, n.z);
        br.rotation.x = (l % 2 ? 1 : -1) * 0.75;
        scene.add(br);
        var br2 = box(5.4, 0.15, 0.15, mat);
        br2.position.set(n.x, y, n.z + (side ? s : -s));
        br2.rotation.z = (l % 2 ? 1 : -1) * 0.75;
        scene.add(br2);
      });
    }
    var plat = box(4.6, 0.35, 4.6, mat); plat.position.set(n.x, n.h - 0.17, n.z); scene.add(plat);
    [[0, -2.25, 4.5, 0.06], [0, 2.25, 4.5, 0.06], [-2.25, 0, 0.06, 4.5], [2.25, 0, 0.06, 4.5]].forEach(function (r) {
      var top = box(r[2], 0.06, r[3], rail); top.position.set(n.x + r[0], n.h + 1.0, n.z + r[1]); scene.add(top);
    });
    var shadow = new THREE.Mesh(new THREE.PlaneGeometry(9, 9), new THREE.MeshBasicMaterial({ map: blobTex, transparent: true, depthWrite: false }));
    shadow.rotation.x = -Math.PI / 2; shadow.position.set(n.x, 0.03, n.z); scene.add(shadow);

    // 移動用の緑のひし形
    var bc = new THREE.Group();
    var gem = new THREE.Mesh(new THREE.OctahedronGeometry(0.7), new THREE.MeshBasicMaterial({ color: 0x5dff9b, fog: false }));
    bc.add(gem);

    muzzleFlash.material.opacity = 1;
    if (!renderer.xr.isPresenting) recoil = 0.06;
    raycaster.set(headPos, aimDir);
    raycaster.far = 900;
    var targets = solids.concat(beacons.filter(function (b) { return b.group.visible; }).map(function (b) { return b.hit; }));
    var res = raycaster.intersectObjects(targets, false);
    var end = headPos.clone().addScaledVector(aimDir, 400);
    lastHitName = res.length ? ((res[0].object.userData.robot ? "robot" : res[0].object.type) + "@" + res[0].distance.toFixed(1)) : "none";
    if (res.length) {
      var h = res[0];
      end.copy(h.point);
      if (h.object.userData.robot && h.object.userData.robot.alive) {
        hits++;
        killRobot(h.object.userData.robot, h.point, aimDir);
        var left = aliveCount();
        if (left === 0) {
          state = "clear"; clearT = 0; endTime = performance.now();
          var t = (endTime - startTime) / 1000;
          var isBest = best === null || t < best;
          if (isBest) { best = t; try { localStorage.setItem("vr-sniper-best", String(best)); } catch (e) {} }
          clearInfo = "時間 " + fmtTime(t) + " ・ 命中 " + hits + "/" + shots + (isBest ? " ・ 新記録" : "");
        } else {
          say("命中！ のこり " + left + "体", 1.6);
        }
      } else if (typeof h.object.userData.beacon === "number") {
        moveNext(h.object.userData.beacon);
      } else {
        burst(h.point, 10, 2.5);
        flash(h.point, 0xffe0b0, 1.2, 0.15);
        say("はずれ", 0.8);
      }
    }
    var start = new THREE.Vector3(); muzzle.getWorldPosition(start);
    var line = new THREE.Line(
      new THREE.BufferGeometry().setFromPoints([start, end]),
      new THREE.LineBasicMaterial({ color: 0xffe2a0, transparent: true, opacity: 0.9, blending: THREE.AdditiveBlending, depthWrite: false })
    );
    scene.add(line);
    tracers.push({ line: line, life: 0.12 });
  }
  var clearInfo = "", lastHitName = "";

  // ===== 入力：コントローラー =====
  var lastSelect = -1e9, pendingBtn = -1, prevBtn = {};
  for (var ci = 0; ci < 2; ci++) {
    (function (ctrl) {
      ctrl.addEventListener("connected", function () { activeCtrl = ctrl; ctrl.add(gun); });
      ctrl.addEventListener("selectstart", function () {
        activeCtrl = ctrl; if (gun.parent !== ctrl) ctrl.add(gun);
        lastSelect = performance.now();
        startAudio();
        if (state === "clear") { if (clearT > 2.5) resetGame(); return; }
        scoping = true; playClick();
      });
      ctrl.addEventListener("selectend", function () {
        lastSelect = performance.now();
        if (scoping) { scoping = false; fire(); }
      });
      rig.add(ctrl);
    })(renderer.xr.getController(ci));
  }
  // タッチパッドなど、引き金以外のボタンで移動（引き金と同時に動いたボタンは数えない）
  function pollButtons(now) {
    var session = renderer.xr.getSession();
    if (!session) return;
    var srcs = session.inputSources;
    for (var i = 0; i < srcs.length; i++) {
      var gp = srcs[i].gamepad;
      if (!gp) continue;
      for (var b = 0; b < gp.buttons.length; b++) {
        var key = i + ":" + b;
        var p = !!(gp.buttons[b] && gp.buttons[b].pressed);
        if (p && !prevBtn[key]) pendingBtn = now;
        prevBtn[key] = p;
      }
    }
    if (pendingBtn > 0 && now - pendingBtn > 160) {
      if (Math.abs(lastSelect - pendingBtn) > 220) moveNext();
      pendingBtn = -1;
    }
  }

  // ===== 入力：パソコン・スマホ =====
  var yaw = 0, pitch = -0.12, recoil = 0;
  var lastX = 0, lastY = 0, touchDown = false;
  var zoomT = 0, swayT = 0, breath = 0, breathRest = 0;
  var scopeEl = document.getElementById("scope");
  function look(dx, dy) {
    var sens = 0.0032 * (camera.fov / BASE_FOV);
    yaw -= dx * sens; pitch -= dy * sens;
    pitch = Math.max(-1.3, Math.min(1.0, pitch));
  }
  canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });
  canvas.addEventListener("pointerdown", function (e) {
    if (renderer.xr.isPresenting) return;
    startAudio();
    lastX = e.clientX; lastY = e.clientY;
    if (e.pointerType === "mouse" && document.pointerLockElement !== canvas) lockPointer();
    if (e.button === 2) { moveNext(); return; }
    if (state === "clear") { if (clearT > 2.5) resetGame(); return; }
    if (e.pointerType !== "mouse") touchDown = true;
    scoping = true; playClick();
  });
  window.addEventListener("pointerup", function (e) {
    if (renderer.xr.isPresenting) return;
    touchDown = false;
    if (e.button === 2) return;
    if (scoping) { scoping = false; fire(); }
  });
  window.addEventListener("pointermove", function (e) {
    if (renderer.xr.isPresenting || state === "menu") return;
    if (document.pointerLockElement === canvas) { look(e.movementX || 0, e.movementY || 0); return; }
    if (e.pointerType === "mouse" || touchDown) look(e.clientX - lastX, e.clientY - lastY);
    lastX = e.clientX; lastY = e.clientY;
  });
  window.addEventListener("keydown", function (e) {
    if (e.code === "Space" || e.code === "KeyE") { moveNext(); e.preventDefault(); }
    if ((e.code === "ShiftLeft" || e.code === "ShiftRight") && breath <= 0 && breathRest <= 0) { breath = 3; }
  });

  // ===== 1コマごとの処理 =====
  var clock = new THREE.Clock();
  var hidden = [scopeGroup, hud, gun, centerDot, fade];
  var hiddenState = [];

  function tick() {
    var dt = Math.min(clock.getDelta(), 0.05);
    var now = performance.now();
    var inXR = renderer.xr.isPresenting;

    if (inXR) pollButtons(now);

    // のぞき具合（0 = ふつう、1 = のぞききった）
    var wantZoom = scoping && state === "play" && moveTarget < 0 ? 1 : 0;
    zoomT += (wantZoom - zoomT) * Math.min(1, dt * 16);
    if (Math.abs(wantZoom - zoomT) < 0.003) zoomT = wantZoom;
    var ez = zoomT * zoomT * (3 - 2 * zoomT);

    // 息を止める（3秒）→ そのあと2秒は止められない
    if (breath > 0) { breath -= dt; if (breath <= 0) breathRest = 2; }
    else if (breathRest > 0) breathRest -= dt;

    // 視点（画面で遊ぶとき）
    if (!inXR) {
      recoil *= Math.pow(0.001, dt);
      // のぞいている間は、呼吸で少しだけゆれる
      swayT += dt;
      var amp = (breath > 0 ? 0.12 : 1) * ez;
      var sx = (Math.sin(swayT * 0.8) + 0.5 * Math.sin(swayT * 2.1)) * 0.0026 * amp;
      var sy = Math.cos(swayT * 0.6) * 0.002 * amp;
      camera.rotation.set(pitch + recoil + sy, yaw + sx, 0);
      var fov = BASE_FOV + (FLAT_SCOPE_FOV - BASE_FOV) * ez;
      if (Math.abs(camera.fov - fov) > 0.01) { camera.fov = fov; camera.updateProjectionMatrix(); }
      scopeEl.style.opacity = String(Math.min(1, ez * 1.3));
      if (gun.parent !== camera) camera.add(gun);
      gun.visible = false;          // パソコンでは銃を出さない
      laser.visible = false;
      centerDot.visible = state === "play" && ez < 0.05;
    } else {
      if (gun.parent === camera && activeCtrl) { activeCtrl.add(gun); }
      if (gun.parent !== camera) { gun.position.set(0, 0, 0); gun.rotation.set(0, 0, 0); gun.scale.setScalar(1); }
      gun.visible = ez < 0.05;      // のぞいている間は手元の銃を消す
      laser.visible = ez < 0.05 && state === "play";
      centerDot.visible = false;
      scopeEl.style.opacity = "0";
    }

    // 移動の暗転
    if (moveTarget >= 0) {
      moveFade += dt;
      if (moveFade < 0.25) fade.material.opacity = moveFade / 0.25;
      else {
        if (nestIndex !== moveTarget) placeAtNest(moveTarget);
        fade.material.opacity = Math.max(0, 1 - (moveFade - 0.25) / 0.3);
        if (moveFade > 0.55) { moveTarget = -1; fade.material.opacity = 0; say("移動しました（" + (nestIndex + 1) + "/3）", 1.2); }
      }
    }

    var n = NESTS[nestIndex];
    rig.position.set(n.x, n.h + (inXR ? EYE : 0), n.z);
    rig.updateMatrixWorld(true);

    if (state !== "menu") {
      updateRobots(dt);
      updateDebris(dt);
      updateSparks(dt);
      updateFlashes(dt);
      beacons.forEach(function (b) { b.gem.rotation.y += dt * 1.5; b.group.position.y = NESTS[beacons.indexOf(b)].h + 3.4 + Math.sin(now / 500) * 0.25; });
      for (var i = tracers.length - 1; i >= 0; i--) {
        tracers[i].life -= dt;
        tracers[i].line.material.opacity = Math.max(0, tracers[i].life / 0.12);
        if (tracers[i].life <= 0) { scene.remove(tracers[i].line); tracers.splice(i, 1); }
      }
      muzzleFlash.material.opacity = Math.max(0, muzzleFlash.material.opacity - dt * 14);
    }

    // 文字
    if (msgT > 0) msgT -= dt;
    if (state === "play") {
      var t = (now - startTime) / 1000;
      drawHud(msgT > 0 ? msg : "のこり " + aliveCount() + "体", fmtTime(t) + " ・ 弾 " + shots + "発", msgT > 0 && msg.indexOf("命中") === 0 ? "#ffcf7a" : "#f1ece2");
    } else if (state === "clear") {
      clearT += dt;
      drawHud("ミッション完了！", clearT > 2.5 ? "引き金でもう一度" : clearInfo, "#8fe39a");
    }
    hud.visible = state !== "menu" && ez < 0.4;

    // スコープ（VR）：目の前に大きなレンズ、まわりは真っ暗
    computeAim();
    scopeGroup.visible = inXR && ez > 0.01 && state === "play";
    if (scopeGroup.visible) {
      scopeGroup.position.copy(headPos).addScaledVector(aimDir, LENS_D);
      scopeGroup.lookAt(headPos);
      scopeGroup.scale.setScalar(0.65 + 0.35 * ez);
      dim.material.opacity = ez;
      scopeCam.position.copy(headPos);
      scopeCam.lookAt(headPos.x + aimDir.x, headPos.y + aimDir.y, headPos.z + aimDir.z);
      scopeCam.updateMatrixWorld(true);
      // スコープの中を描く（自分の銃や文字は写さない）
      for (var h = 0; h < hidden.length; h++) { hiddenState[h] = hidden[h].visible; hidden[h].visible = false; }
      var xrOn = renderer.xr.enabled;
      var prevRT = renderer.getRenderTarget();
      renderer.xr.enabled = false;
      renderer.setRenderTarget(rt);
      renderer.render(scene, scopeCam);
      renderer.setRenderTarget(prevRT);
      renderer.xr.enabled = xrOn;
      for (h = 0; h < hidden.length; h++) hidden[h].visible = hiddenState[h];
    }

    renderer.render(scene, camera);
  }

  function onResize() {
    if (renderer.xr.isPresenting) return;
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.fov = BASE_FOV;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  }
  window.addEventListener("resize", onResize);

  // ===== はじめ方 =====
  function showOverlay(show) { overlay.hidden = !show; }

  btnFlat.addEventListener("click", function () {
    startAudio();
    camera.position.set(0, EYE, 0);
    resetGame();
    say("左クリックでスコープ、はなすと発射", 3);
    showOverlay(false);
    lockPointer();
  });
  function lockPointer() {
    if (!canvas.requestPointerLock) return;
    try {
      var p = canvas.requestPointerLock();
      if (p && p.catch) p.catch(function () {});
    } catch (e) {}
  }

  btnVR.addEventListener("click", function () {
    startAudio();
    if (!navigator.xr) return;
    navigator.xr.requestSession("immersive-vr").then(function (session) {
      session.addEventListener("end", function () {
        state = "menu"; scoping = false;
        camera.position.set(0, EYE, 0);
        showOverlay(true);
        onResize();
      });
      return renderer.xr.setSession(session).then(function () {
        camera.position.set(0, 0, 0);
        resetGame();
        showOverlay(false);
      });
    }).catch(function (err) {
      note.textContent = "VRを始められませんでした（" + (err && err.message ? err.message : err) + "）。";
    });
  });

  if (navigator.xr && navigator.xr.isSessionSupported) {
    navigator.xr.isSessionSupported("immersive-vr").then(function (ok) {
      btnVR.disabled = !ok;
      note.textContent = ok ? "VRゴーグルの中なら「VRで遊ぶ」を押してください。" : "このブラウザではVRが使えません。「画面で遊ぶ」で試せます。";
    }).catch(function () { note.textContent = "このブラウザではVRが使えません。「画面で遊ぶ」で試せます。"; });
  } else {
    note.textContent = "このブラウザではVRが使えません。「画面で遊ぶ」で試せます。";
  }

  // 最初の画面の背景として、場面を作っておく
  spawnRobots();
  placeAtNest(0);
  camera.position.set(0, EYE, 0);
  renderer.setAnimationLoop(tick);
})();
</script>
</body>
</html>
